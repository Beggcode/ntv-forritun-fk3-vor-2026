name: Skilaverkefni 2

on:
  push:
    branches: [main, skilaverkefni-2]
  pull_request:
    branches: [main]

jobs:
  vitest:
    name: Unit and Storybook Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skilaverkefni-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skilaverkefni-1/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:run

  cypress:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skilaverkefni-1/package-lock.json
      - run: npm ci
        working-directory: skilaverkefni-1
      - uses: cypress-io/github-action@v6
        with:
          working-directory: skilaverkefni-1
          install: false
          start: npm run dev
          wait-on: http://localhost:5173
